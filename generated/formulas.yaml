LibListing.calcBuyPrice:
  file: src/libraries/LibListing.sol
  used_by: [ListingBuy, ListingSell]
  code: |-
    function calcBuyPrice(
      IUintComp comps,
      uint256 id,
      uint256 amt
    ) internal view returns (uint256 price) {
      if (amt == 0) return 0;
      uint256 buyID = LibRegistry.genBuyID(id);
      string memory type_ = TypeComponent(getAddrByID(comps, TypeCompID)).get(buyID);
      if (type_.eq("FIXED")) {
        return IUintComp(getAddrByID(comps, ValueCompID)).safeGet(id) * amt;
      } else if (type_.eq("GDA")) {
        GDAParams memory params = GDAParams(
          ValueComponent(getAddrByID(comps, ValueCompID)).safeGet(id),
          TimeStartComponent(getAddrByID(comps, TimeStartCompID)).safeGet(id),
          PeriodComponent(getAddrByID(comps, PeriodCompID)).get(buyID).toUint256(),
          DecayComponent(getAddrByID(comps, DecayCompID)).get(buyID).toUint256() * 1e12,
          RateComponent(getAddrByID(comps, RateCompID)).get(buyID),
          BalanceComponent(getAddrByID(comps, BalanceCompID)).safeGet(id).toUint256(),
          amt
        );
        require(amt <= params.rate * MAX_BATCH_PERIODS, "LibListing: batch too large");

        // deficit clamp: price floor of target × decay^MAX_DEFICIT_PERIODS. View-side
        // only; buy/sell settle the stored deficit to the same bound (settleGDA), so
        // displayed and charged prices always agree. Applied here, NOT in LibGDA:
        // auctions share that library and want unbounded decay.
        uint256 cap = gdaCapSeconds(params.prevSold, params.period, params.rate);
        if (block.timestamp - params.startTs > cap) params.startTs = block.timestamp - cap;

        int256 costWad = LibGDA.calc(params);
        require(costWad > 0, "LibListing: non-positive GDA cost");
        price = (uint256(costWad) + 1e18 - 1) / 1e18; // round up
        return price < amt ? amt : price; // at least 1 currency per unit
      } else revert("LibListing: invalid buy type");
    }
LibListing.calcSellPrice:
  file: src/libraries/LibListing.sol
  used_by: [ListingSell]
  code: |-
    function calcSellPrice(
      IUintComp comps,
      uint256 id,
      uint256 amt
    ) internal view returns (uint256 price) {
      uint256 sellID = LibRegistry.genSellID(id);
      string memory type_ = TypeComponent(getAddrByID(comps, TypeCompID)).get(sellID);
      if (type_.eq("FIXED")) {
        return IUintComp(getAddrByID(comps, ValueCompID)).safeGet(id) * amt;
      } else if (type_.eq("SCALED")) {
        int32 scale = ScaleComponent(getAddrByID(comps, ScaleCompID)).get(sellID);
        return (calcBuyPrice(comps, id, amt) * scale.toUint256()) / 1e9;
      } else revert("LibListing: invalid sell type");
    }
LibPool.calcAmountOut:
  file: src/libraries/LibPool.sol
  used_by: [Pool]
  code: |-
    function calcAmountOut(
      uint256 amountIn,
      uint256 reserveIn,
      uint256 reserveOut,
      uint256 feeBps
    ) internal pure returns (uint256) {
      uint256 amountInWithFee = amountIn * (BPS_DENOMINATOR - feeBps);
      return (amountInWithFee * reserveOut) / (reserveIn * BPS_DENOMINATOR + amountInWithFee);
    }
