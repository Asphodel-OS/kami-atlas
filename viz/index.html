<meta charset="utf-8">
<title>Kami Domain Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: overview map of typed entities in three bands; clicking one swaps the map for that entity's structure.
   Nodes carry the layer (tinted fill), edges carry the relationship type (colour) and required-ness (solid / dashed). */
:root {
  --bg: #f2f4f1; --panel: #ffffff; --ink: #18211d; --muted: #5b6862; --line: #d6ddd8; --wash: #e9eeea;
  --runtime: #1d7560; --hybrid: #9c6400; --registry: #4a52a3;
  --r-ownership: #1f2a25; --r-registry: #3d6fb6; --r-directed: #b0482b; --r-attachment: #7a4fa6; --r-classifier: #a07a12; --r-keyed: #2e8a7a;
  --warn: #b4232c;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --panel: #161f1c; --ink: #e5ebe7; --muted: #93a29b; --line: #2a3632; --wash: #1d2824;
  --runtime: #4cc29f; --hybrid: #e2a83c; --registry: #939bf0;
  --r-ownership: #e5ebe7; --r-registry: #7fa8ec; --r-directed: #f08a6b; --r-attachment: #c39af0; --r-classifier: #e8c25a; --r-keyed: #5fd0bb;
  --warn: #f0717a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --panel: #161f1c; --ink: #e5ebe7; --muted: #93a29b; --line: #2a3632; --wash: #1d2824;
  --runtime: #4cc29f; --hybrid: #e2a83c; --registry: #939bf0;
  --r-ownership: #e5ebe7; --r-registry: #7fa8ec; --r-directed: #f08a6b; --r-attachment: #c39af0; --r-classifier: #e8c25a; --r-keyed: #5fd0bb;
  --warn: #f0717a; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; padding-inline: 16px; padding-block: 12px; gap: 10px; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
h1 { font: 600 22px/1.1 var(--f-display); margin: 0; }
h1 small { display: block; font: 400 12px/1.3 var(--f-mono); color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.search { position: relative; }
.search input { font: 13px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; width: 230px; max-width: 70vw; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.results { position: absolute; top: 100%; left: 0; right: 0; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; max-height: 300px; overflow: auto; }
.results button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 6px 10px; border: 0; background: none; color: var(--ink); font: 13px var(--f-body); cursor: pointer; }
.results button:hover, .results button.on { background: var(--wash); }
.results em { font: 11px var(--f-mono); color: var(--muted); font-style: normal; }
.chip { font: 500 12px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; }
.chip[aria-pressed="false"] .dot { opacity: .3; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.map { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 0; }
.map svg { width: 100%; height: 100%; display: block; cursor: grab; }
.map svg:active { cursor: grabbing; }
.crumb { position: absolute; left: 12px; top: 10px; display: flex; gap: 8px; align-items: center; z-index: 3; font: 12px var(--f-mono); color: var(--muted); }
.maptools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; z-index: 3; }

/* svg */
.band { fill: var(--wash); opacity: .6; }
.band-label { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
.node { cursor: pointer; }
.node circle { stroke-width: 2.5; }
.node .name { font: 500 11px var(--f-mono); fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3.5px; pointer-events: none; }
.node:hover circle, .node:focus-visible circle { stroke-width: 4; }
.edge .line { fill: none; stroke-width: 1.6; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: help; }
.edge.optional .line { stroke-dasharray: 6 5; }
.edge .lbl { font: 10px var(--f-mono); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
.edge:hover .line { stroke-width: 3; }
.zoomed-out .edge .lbl { display: none; }
.far .node .name { display: none; }
.faded { opacity: .1; transition: opacity .12s; }
.node.pinned circle { stroke-width: 4; }
.node.untyped circle { stroke-dasharray: 4 3; }
.node.singleton path { stroke-width: 2; }
.node .badge { font: 600 9.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
.sysbtn { font: 500 12px var(--f-mono); color: var(--ink); background: none; border: 1px dashed var(--line); border-radius: 4px; padding: 0 5px; cursor: pointer; }
.sysbtn:hover { border-color: var(--ink); border-style: solid; }
.hint { position: absolute; right: 12px; bottom: 10px; font: 11px var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 3px 6px; border-radius: 4px; pointer-events: none; text-align: right; }
.maptools .chip { min-width: 30px; justify-content: center; }
.card rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.card.center rect.box { stroke-width: 2.5; }
.card .title { font: 600 15px var(--f-display); fill: var(--ink); }
.card .meta { font: 10.5px var(--f-mono); fill: var(--muted); }
.card .field { font: 11px var(--f-mono); fill: var(--ink); }
.card .field.shared { fill: var(--muted); }
.card.link { cursor: pointer; }
.card.link:hover rect.box { stroke: var(--ink); }
.col-label { font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }

.legend { position: absolute; left: 12px; top: 10px; z-index: 2; display: grid; gap: 3px; font: 11px var(--f-mono); color: var(--ink);
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; pointer-events: none; max-width: calc(100% - 120px); }
.legend .lg-title { font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.legend .lg-title:first-child { margin-top: 0; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend .lg-note { color: var(--muted); }
.legend svg { width: 28px; height: 8px; flex: none; }
.map.focus .legend { top: 50px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 24px rgb(0 0 0 / .18); font: 12.5px/1.45 var(--f-body); padding: 10px 12px; border-radius: 8px; width: max-content; max-width: 340px; z-index: 5; }
.tip h4 { margin: 0 0 4px; font: 600 15px var(--f-display); }
.tip .row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 2px 8px; margin-top: 4px; }
.tip .row b { font: 500 10.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.tip code { font: 11.5px var(--f-mono); word-break: break-word; }
.tip ul { margin: 2px 0 0; padding-left: 16px; }

/* the sidebar floats over the map instead of taking space from it */
aside { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(380px, calc(100% - 24px)); z-index: 4;
  background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 32px rgb(0 0 0 / .22); display: flex; flex-direction: column; overflow: hidden; }
.main:not(.collapsed) .maptools { right: 404px; }
.main:not(.collapsed) .hint { right: 404px; }
.sidetabs { display: flex; align-items: center; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.sidetabs [role="tab"] { font: 500 12.5px var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px 8px; cursor: pointer; }
.sidetabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.sidetabs .collapse { margin-left: auto; font: 14px var(--f-mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 26px; cursor: pointer; margin-bottom: 6px; }
.sidetabs .collapse:hover { color: var(--ink); border-color: var(--ink); }
.sidebody { overflow: auto; padding: 16px 18px; flex: 1; min-height: 0; }
.main.collapsed aside { display: none; }
.set-group { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.set-group:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.set-group h3 { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.set-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.set-row label { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.set-range { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 13px; }
.set-range input { width: 100%; accent-color: var(--ink); }
.set-range output { font: 12px var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { font: 500 12px var(--f-body); color: var(--muted); background: none; border: 0; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); }
.lbl-off .edge .lbl { display: none !important; }
.lbl-on .edge .lbl { display: inline !important; }
.names-off .node .name { display: none; }
aside h2 { font: 600 24px/1.1 var(--f-display); margin: 4px 0 6px; word-break: break-word; }
.what { margin: 8px 0 0; max-width: 62ch; }
.pill { font: 500 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: var(--panel); display: inline-block; }
section.block { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
section.block h3 { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
code { font: 12px var(--f-mono); word-break: break-word; }
.k { font: 12px var(--f-mono); color: var(--muted); }
.ent { font: 500 12px var(--f-mono); color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.ent:hover { border-color: var(--ink); }
.tag { font: 10.5px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.rel { display: grid; gap: 3px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.rel:last-child { border-bottom: 0; }
.rel .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.cmp { font: 11.5px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; background: var(--bg); }
.cmp.own { border-color: var(--ink); }
.confirmed { margin: 8px 0 0; padding: 8px 10px; background: var(--wash); border-radius: 6px; font-size: 13px; }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
details summary { cursor: pointer; font: 500 12px var(--f-mono); color: var(--muted); }

@media (max-width: 900px) {
  aside { top: auto; left: 12px; width: auto; height: 55%; }
  .main:not(.collapsed) .maptools, .main:not(.collapsed) .hint { right: 10px; }
  .main:not(.collapsed) .hint { display: none; }
  .controls { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Kami Domain Atlas<small id="sourceline">Kamigotchi World · loading…</small></h1>
    <div class="controls">
      <div class="search">
        <input id="q" type="search" placeholder="Find an entity, record, field or system" aria-label="Search" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="map" id="map">
      <div class="crumb" id="crumb" hidden><button class="chip" id="back">← All entities</button><span id="crumb-name"></span></div>
      <div class="maptools"><button class="chip" id="expand" hidden title="Show the panel (])">⟨ Panel</button><button class="chip" id="zin" aria-label="Zoom in">+</button><button class="chip" id="zout" aria-label="Zoom out">−</button><button class="chip" id="fit">Fit</button></div>
      <div class="hint" id="hint">drag to pan · scroll to zoom · the cursor snaps to the nearest entity: click to open, drag to pin, double-click to release · + − 0 keys</div>
      <svg id="svg" role="img" aria-label="Map of Kamigotchi entities and their relationships"></svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside id="side" aria-label="Side panel">
      <div class="sidetabs" role="tablist">
        <button role="tab" id="tab-details" aria-selected="true" aria-controls="panel">Details</button>
        <button role="tab" id="tab-settings" aria-selected="false" aria-controls="settings">Settings</button>
        <button class="collapse" id="collapse" aria-label="Collapse the panel" title="Collapse the panel (])">⟩</button>
      </div>
      <div class="sidebody" id="panel" role="tabpanel" aria-live="polite"></div>
      <div class="sidebody" id="settings" role="tabpanel" hidden>
        <div class="set-group"><h3>Cursor effects</h3>
          <div class="set-row"><span class="small muted" style="width:88px">Lens</span><span class="seg" id="set-lens"><button data-v="fisheye">Fisheye</button><button data-v="soft">Soft</button><button data-v="hyperbolic">Hyperbolic</button><button data-v="off">Off</button></span></div>
          <div class="set-range"><label for="set-lstr">Strength</label><input type="range" id="set-lstr" min="0" max="8" step="0.1"><output id="out-lstr"></output></div>
          <div class="set-range"><label for="set-lrad">Radius</label><input type="range" id="set-lrad" min="60" max="400" step="10"><output id="out-lrad"></output></div>
          <div class="set-range"><label for="set-lfol">Follow</label><input type="range" id="set-lfol" min="0.05" max="1" step="0.01"><output id="out-lfol"></output></div>
          <div class="set-row"><label><input type="checkbox" id="set-push"> Repulsion</label></div>
          <div class="set-range"><label for="set-pstr">Push</label><input type="range" id="set-pstr" min="0.5" max="8" step="0.1"><output id="out-pstr"></output></div>
          <div class="set-row"><label><input type="checkbox" id="set-snap"> Snap to nearest entity</label></div>
          <div class="set-range"><label for="set-sdist">Snap distance</label><input type="range" id="set-sdist" min="8" max="60" step="1"><output id="out-sdist"></output></div>
        </div>
        <div class="set-group"><h3>Layers</h3><div class="set-row">
          <button class="chip" id="f-runtime" aria-pressed="true"><span class="dot" style="background:var(--runtime)"></span>Runtime</button>
          <button class="chip" id="f-hybrid" aria-pressed="true"><span class="dot" style="background:var(--hybrid)"></span>Hybrid</button>
          <button class="chip" id="f-registry" aria-pressed="true"><span class="dot" style="background:var(--registry)"></span>Registry</button>
        </div></div>
        <div class="set-group"><h3>Relationship types</h3><div class="set-row" id="set-rels"></div></div>
        <div class="set-group"><h3>Labels</h3>
          <div class="set-row"><span class="small muted" style="width:88px">Edge labels</span><span class="seg" id="set-lbl"><button data-v="auto">Auto</button><button data-v="on">Always</button><button data-v="off">Off</button></span></div>
          <div class="set-row"><label><input type="checkbox" id="set-names"> Entity names</label></div>
        </div>
        <div class="set-group"><h3>Layout</h3>
          <div class="set-range"><label for="set-spacing">Spacing</label><input type="range" id="set-spacing" min="0.5" max="2" step="0.1"><output id="out-spacing"></output></div>
          <div class="set-range"><label for="set-link">Link length</label><input type="range" id="set-link" min="70" max="280" step="10"><output id="out-link"></output></div>
          <div class="set-row"><button class="chip" id="set-reheat">Reheat layout</button><button class="chip" id="set-unpin">Unpin all</button></div>
        </div>
        <div class="set-group"><h3>Overlays</h3><div class="set-row">
          <label><input type="checkbox" id="set-legend"> Legend</label><label><input type="checkbox" id="set-hint"> Controls hint</label>
        </div></div>
        <div class="set-group"><div class="set-row"><button class="chip" id="set-reset">Reset settings</button><span class="muted small">Saved in this browser.</span></div></div>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
(async function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const arr = v => v == null ? [] : Array.isArray(v) ? v : [v];
  const LAYERS = ['runtime', 'hybrid', 'registry'];
  const LAYER_NAME = { runtime: 'Runtime', hybrid: 'Hybrid', registry: 'Registry' };
  const REL_NAME = { ownership: 'Ownership', registry: 'Registry reference', directed: 'Directed', attachment: 'Attachment', classifier: 'Classifier', keyed: 'Keyed sub-entity' };
  const panel = document.getElementById('panel');

  let model, systems, comps, notes = {};
  try {
    [model, systems, comps] = await Promise.all(['domain-model.json', 'systems.json', 'components.json']
      .map(f => fetch('data/' + f).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); })));
    try { notes = jsyaml.load(await (await fetch('data/notes.yaml')).text()) || {}; } catch (e) { notes = {}; }
  } catch (e) {
    panel.innerHTML = '<h2>Data did not load</h2><p class="muted">' + esc(e.message) + '. Rerun kami/kami-atlas/generate.py and republish.</p>';
    return;
  }
  const E = model.entities, NE = notes.entities || {}, NL = notes.links || {}, NS = notes.sub_entities || {};
  const RT = model.relationship_types || {};
  const SG = model.singletons || {};

  // ---------------- facts ----------------
  const compUse = {};
  for (const [n, e] of Object.entries(E)) for (const c of e.components || []) (compUse[c] = compUse[c] || []).push(n);
  const uniqueFields = n => (E[n].components || []).filter(c => compUse[c].length === 1);
  const changedBy = n => { const own = uniqueFields(n); return Object.keys(systems).filter(s => !s.startsWith('__') && (systems[s].writes || []).some(c => own.includes(c))).sort(); };

  // every relationship, with notes applied
  const rels = [];
  for (const [n, e] of Object.entries(E)) for (const [comp, l] of Object.entries(e.links || {})) {
    const o = NL[n + '.' + comp];
    if (o && o.ignore) continue;
    const to = (o && o.to ? arr(o.to).flatMap(t => String(t).split(/\s*\|\s*/)) : arr(l.to)).filter(Boolean);
    const base = { from: n, comp, l, note: o && o.note, fromNotes: !!(o && o.to), unresolved: !to.length };
    if (!to.length) rels.push({ ...base, to: null });
    for (const t of to) rels.push({ ...base, to: t });
  }
  const anchorUsers = {};  // anchor key -> [{from, comp}] of records that point at it
  for (const r of rels) for (const d of arr(r.l.derived)) {
    const m = String(d).match(/through anchor keys (.+)$/);
    if (m) for (const ns of m[1].split(/,\s*/)) {
      anchorUsers[ns] = anchorUsers[ns] || [];
      if (!anchorUsers[ns].some(u => u.from === r.from && u.comp === r.comp)) anchorUsers[ns].push({ from: r.from, comp: r.comp });
    }
  }
  const subKindLine = x => x.s.kind === 'anchor key'
    ? 'anchor key' + (anchorUsers[x.ns] ? ' ← ' + anchorUsers[x.ns].map(u => u.from + '.' + u.comp).join(', ') : arr(x.s.pointed_at_by).length ? ' ← ' + arr(x.s.pointed_at_by).join(', ') : '')
    : 'record' + (x.s.shape ? ' (a ' + x.s.shape + ')' : '') + (arr(x.s.fields).length ? ': ' + arr(x.s.fields).join(', ') : '');
  const relsOf = n => ({ out: rels.filter(r => r.from === n), in: rels.filter(r => r.to === n && r.from !== n) });
  const subsOf = n => {
    const own = Object.entries(E[n].sub_entities || {}).map(([ns, s]) => ({ ns, s, shared: false }));
    const shared = Object.entries(model.shared_sub_entities || {}).filter(([, s]) => arr(s.held_by).includes(n)).map(([ns, s]) => ({ ns, s, shared: true }));
    return own.concat(shared);
  };

  // ---------------- tooltip ----------------
  const tip = document.getElementById('tip'), wrap = document.getElementById('map');
  function placeTip(ev) {
    const r = wrap.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    if (x + w > r.width - 8) x = Math.max(8, ev.clientX - r.left - w - 14);
    if (y + h > r.height - 8) y = Math.max(8, r.height - h - 8);

  }
  const list = (xs, max = 8) => xs.length ? xs.slice(0, max).map(x => '<code>' + esc(x) + '</code>').join(', ') + (xs.length > max ? ` <span class="muted">+${xs.length - max} more</span>` : '') : '<span class="muted">none</span>';
  function entityTip(n) {
    const e = E[n], nt = NE[n] || {}, cb = changedBy(n);
    return `<h4>${esc(n)}</h4><span class="pill" style="background:var(--${e.layer})">${esc(LAYER_NAME[e.layer])}</span>
      ${nt.what ? `<div style="margin-top:6px">${esc(nt.what)}</div>` : ''}
      <div class="row"><b>Created by</b><span>${list(arr(e.created_by))}</span></div>
      <div class="row"><b>Changed by</b><span>${cb.length ? list(cb) : '<span class="muted">no field unique to it, so not isolable</span>'}</span></div>
      <div class="row"><b>Structure</b><span>${(e.components || []).length} fields · ${subsOf(n).length} sub-entities · ${relsOf(n).out.length} out, ${relsOf(n).in.length} in</span></div>
      <div class="muted small" style="margin-top:6px">Click to open its structure.</div>`;
  }
  function singletonTip(n) {
    const g = SG[n] || {};
    return `<h4>${esc(n)}</h4><span class="pill" style="background:var(--muted)">Singleton</span>
      <div style="margin-top:6px">One entity at a fixed id, not a type: there is only ever one.</div>
      <div class="row"><b>Id</b><span><code>${esc(g.id || '')}</code> (constant <code>${esc(g.constant || '')}</code>)</span></div>
      <div class="row"><b>Used in</b><span>${list(arr(g.used_in))}</span></div>`;
  }
  function systemTip(n, role) {
    return `<h4>${esc(n)}</h4><div><b>${esc(role)}</b> by <code>${esc(st.system)}</code></div>${entityTip(n).replace(/^<h4>.*?<\/h4>/, '')}`;
  }
  function relTip(r) {
    const l = r.l;
    const dir = `<code>${esc(r.from)}</code> → <code>${esc(r.to || '?')}</code>`;
    return `<h4>${esc(r.comp)}</h4>
      <div>${dir} · ${esc(REL_NAME[l.type] || l.type)} · ${l.required ? 'required' : 'optional'}</div>
      <div class="muted small" style="margin-top:2px">${esc(RT[l.type] || '')}</div>
      <div class="row"><b>Stored on</b><span><code>${esc(l.stored_on)}</code>, as the value of <code>${esc(r.comp)}</code></span></div>
      ${!l.required && l.only_when ? `<div class="row"><b>Only when</b><span>${l.only_when.map(c => '<code>' + esc(c) + '</code>').join('<br>')}</span></div>` : ''}
      <div class="row"><b>Cardinality</b><span>${esc(l.cardinality || '')}</span></div>
      ${'changes_after_creation' in l ? `<div class="row"><b>Lifecycle</b><span>${l.changes_after_creation ? 'can change after creation' : 'fixed at creation'}${l.removable ? '; can be removed' : ''}</span></div>` : ''}
      <div class="row"><b>Navigate</b><span>up: ${esc(l.navigate?.up || '')}<br>down: ${esc(l.navigate?.down || '')}</span></div>
      <div class="row"><b>Derived</b><span><ul>${arr(l.derived).map(d => '<li><code>' + esc(d) + '</code></li>').join('')}</ul>
        ${r.fromNotes ? `<div>Target set in notes: ${esc(r.note || '')}</div>` : l.inferred ? '<div class="muted">Target inferred by tracing variable names through callers.</div>' : ''}
        ${r.unresolved ? '<div style="color:var(--warn)">Target not resolved from the code.</div>' : ''}</span></div>`;
  }
  function subTip(x, parent) {
    const s = x.s, keys = s.keys ? Object.entries(s.keys).map(([k, v]) => esc(k) + (v ? ' → ' + arr(v).map(esc).join('/') : '')).join(', ') : '';
    return `<h4>${esc(x.ns)}</h4>${(NS[x.ns] || {}).what ? `<div>${esc(NS[x.ns].what)}</div>` : ''}
      <div class="row"><b>Kind</b><span>${esc(subKindLine(x))}</span></div>
      <div class="row"><b>Id</b><span><code>${esc(String(s.id || x.ns).startsWith('address(') ? s.id : 'keccak256(' + (s.id || x.ns) + ')')}</code></span></div>
      ${keys ? `<div class="row"><b>Keys</b><span>${keys}</span></div>` : ''}
      <div class="row"><b>Relation</b><span>${esc(REL_NAME.keyed)} of <code>${esc(parent)}</code>${x.shared ? ' (shared by ' + arr(s.held_by).map(esc).join(', ') + ')' : ''}; required by construction</span></div>
      <div class="row"><b>Navigate</b><span>${esc(s.relation?.navigate?.down || 'compute the id from the parent')}</span></div>
      <div class="row"><b>Placed by</b><span>${esc(s.parent_from || '')}</span></div>`;
  }
  const show = (html, ev) => { tip.innerHTML = html; tip.hidden = false; placeTip(ev); };
  const hide = () => { tip.hidden = true; };

  // ---------------- svg scaffold ----------------
  const svg = d3.select('#svg');
  const defs = svg.append('defs');
  for (const t of Object.keys(REL_NAME)) defs.append('marker').attr('id', 'm-' + t).attr('viewBox', '0 0 10 10')
    .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0 0L10 5L0 10z').style('fill', `var(--r-${t})`);
  const root = svg.append('g');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ms = d => reduceMotion ? 0 : d;
  // Click and drag pans; scroll (wheel, trackpad or pinch) zooms around the pointer.
  let grabbing = false, viewGen = 0;  // grabbing: a node is being dragged, so the background must not pan
  const zoom = d3.zoom().scaleExtent([0.15, 4])
    .filter(ev => ev.type === 'wheel' || (!grabbing && (!ev.ctrlKey || ev.type === 'touchstart') && !ev.button))
    .wheelDelta(ev => -ev.deltaY * (ev.deltaMode === 1 ? 0.05 : ev.deltaMode ? 1 : 0.002) * (ev.ctrlKey ? 6 : 1))
    .on('zoom', ev => {
      root.attr('transform', ev.transform);
      svg.classed('zoomed-out', ev.transform.k < 0.6).classed('far', ev.transform.k < 0.35);
    });
  svg.call(zoom).on('dblclick.zoom', null);
  const zoomBy = f => svg.transition().duration(ms(200)).call(zoom.scaleBy, f);
  const W = () => wrap.clientWidth, H = () => wrap.clientHeight;
  let fitTarget = null;
  function fit(dur = 450) {
    const b = (fitTarget || root).node().getBBox(); if (!b.width) return;
    const lg = document.getElementById('legend'), side_ = document.getElementById('side');
    const lw = (lg.hidden ? 0 : lg.offsetWidth) + 24;  // keep clear of the legend overlay
    const wide = window.matchMedia('(min-width: 901px)').matches;
    const rw = !cfg.collapsed && wide ? side_.offsetWidth + 24 : 0;  // and of the sidebar
    const aw = Math.max(200, W() - lw - rw);
    const s = Math.min(1.6, 0.92 / Math.max((b.width + 60) / aw, (b.height + 70) / H()));
    svg.transition().duration(ms(dur)).call(zoom.transform, d3.zoomIdentity.translate(lw + aw / 2 - s * (b.x + b.width / 2), H() / 2 - s * (b.y + b.height / 2)).scale(s));
  }

  function legend(types, extra, shapes) {
    const line = (stroke, dash) => `<svg viewBox="0 0 28 8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" stroke="${stroke}" stroke-width="2"${dash ? ' stroke-dasharray="4 3"' : ''}/><path d="M21 1L27 4L21 7z" fill="${stroke}"/></svg>`;
    document.getElementById('legend').innerHTML =
      '<span class="lg-title">Relationship type</span>'
      + types.map(t => `<span>${line(`var(--r-${t})`)}${esc(REL_NAME[t])}</span>`).join('')
      + '<span class="lg-title">Line</span>'
      + `<span>${line('var(--muted)')}required</span><span>${line('var(--muted)', true)}optional</span>`
      + `<span class="lg-note">A → B: A stores B's id or index</span>` + (extra ? `<span class="lg-note">${extra}</span>` : '')
      + '<span class="lg-title">Layer (node colour)</span>'
      + LAYERS.map(l => `<span><svg viewBox="0 0 28 8" aria-hidden="true"><circle cx="8" cy="4" r="3.4" fill="color-mix(in srgb, var(--${l}) 22%, var(--panel))" stroke="var(--${l})" stroke-width="1.6"/></svg>${esc(LAYER_NAME[l])}</span>`).join('')
      + (shapes ? '<span class="lg-title">Node</span>'
        + '<span><svg viewBox="0 0 28 8" aria-hidden="true"><circle cx="8" cy="4" r="3.2" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>typed entity</span>'
        + '<span><svg viewBox="0 0 28 8" aria-hidden="true"><circle cx="8" cy="4" r="3.2" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 1.5"/></svg>untyped shape</span>'
        + '<span><svg viewBox="0 0 28 8" aria-hidden="true"><path d="M8,0.5L11.5,4L8,7.5L4.5,4Z" fill="none" stroke="var(--muted)" stroke-width="1.3"/></svg>singleton</span>' : '');
  }

  function edgePath(sx, sy, tx, ty, rT, bend) {
    const dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1;
    const ex = tx - dx / len * rT, ey = ty - dy / len * rT;
    const mx = (sx + ex) / 2 - dy / len * bend, my = (sy + ey) / 2 + dx / len * bend;

  }

  // ---------------- overview ----------------
  const DEFAULTS = { layers: LAYERS.slice(), rel: Object.keys(REL_NAME), edgeLabels: 'auto', names: true, spacing: 1, linkLen: 150, legend: true, hint: true, collapsed: false,
    lensMode: 'fisheye', lensStrength: 2.5, lensRadius: 170, lensFollow: 0.18, pushOn: true, pushStrength: 3, snapOn: true, snapDist: 26 };
  const loadSettings = () => { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('atlas.settings.v1') || '{}')); } catch (e) { return Object.assign({}, DEFAULTS); } };
  const cfg = loadSettings();
  const saveSettings = () => { try { localStorage.setItem('atlas.settings.v1', JSON.stringify(Object.assign(cfg, { layers: [...st.layers], rel: [...st.rel] }))); } catch (e) {} };
  const st = { layers: new Set(cfg.layers.filter(l => LAYERS.includes(l)).length ? cfg.layers : LAYERS), rel: new Set(cfg.rel), view: 'overview', sel: null };
  let sim;
  const BAND = 320, bandY = { runtime: 0, hybrid: 1, registry: 2 };
  const radius = n => E[n] ? 12 + Math.sqrt(subsOf(n).length) * 3.2 : 12;

  function overviewView(system) {
    st.view = 'overview'; st.sel = null; st.system = system && systems[system] ? system : null; hide();
    document.getElementById('crumb').hidden = !st.system; wrap.classList.toggle('focus', !!st.system);
    document.getElementById('crumb-name').textContent = st.system ? 'System: ' + st.system : '';
    root.selectAll('*').remove();
    const ids = Object.keys(E).filter(n => st.layers.has(E[n].layer));
    const nodes = ids.map(id => ({ id, layer: E[id].layer }));
    // singletons that an entity points at (the gacha pool) join the map beside their referrers
    for (const r of rels) if (r.to && SG[r.to] && ids.includes(r.from) && !nodes.some(n => n.id === r.to)) nodes.push({ id: r.to, layer: E[r.from].layer, singleton: true });
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    const er = rels.filter(r => r.to && byId[r.from] && byId[r.to] && r.from !== r.to && st.rel.has(r.l.type));
    const pairCount = {};
    er.forEach(r => { const k = [r.from, r.to].sort().join('|'); r._i = pairCount[k] = (pairCount[k] || 0) + 1; });
    const links = er.map(r => ({ source: r.from, target: r.to, r }));

    const bands = root.append('g');
    const content = root.append('g'); fitTarget = null;  // bands are sized to the nodes, so fit everything
    const eg = content.append('g'), ng = content.append('g');
    const edge = eg.selectAll('g').data(links).join('g').attr('class', d => 'edge ' + (d.r.l.required ? 'required' : 'optional'));
    edge.append('path').attr('class', 'line').style('stroke', d => `var(--r-${d.r.l.type})`).attr('marker-end', d => `url(#m-${d.r.l.type})`);
    edge.append('path').attr('class', 'hit');
    edge.append('text').attr('class', 'lbl').attr('text-anchor', 'middle').style('fill', d => `var(--r-${d.r.l.type})`).text(d => d.r.comp);
    edge.on('mouseenter', (ev, d) => { show(relTip(d.r), ev); edge.classed('faded', e => e !== d); node.classed('faded', n => n.id !== d.source.id && n.id !== d.target.id); })
      .on('mousemove', ev => placeTip(ev))
      .on('mouseleave', () => { hide(); edge.classed('faded', false); node.classed('faded', false); applySystem(); });

    const node = ng.selectAll('g').data(nodes).join('g')
      .attr('class', d => 'node' + (d.singleton ? ' singleton' : E[d.id] && E[d.id].typed === false ? ' untyped' : ''))
      .attr('tabindex', 0).attr('role', 'button').attr('aria-label', d => d.id);
    node.filter(d => !d.singleton).append('circle').attr('r', d => radius(d.id))
      .style('fill', d => `color-mix(in srgb, var(--${d.layer}) 22%, var(--panel))`).style('stroke', d => `var(--${d.layer})`);
    node.filter(d => d.singleton).append('path').attr('d', 'M0,-12L12,0L0,12L-12,0Z')
      .style('fill', 'var(--panel)').style('stroke', 'var(--muted)');
    node.append('text').attr('class', 'name').attr('text-anchor', 'middle').attr('dy', d => radius(d.id) + 14).text(d => d.id);
    const role = {};
    if (st.system) {
      const sy = systems[st.system] || {}, w = new Set(sy.writes || []), rd = new Set(sy.reads || []);
      for (const n of ids) {
        const own = uniqueFields(n);
        if (arr(E[n].created_by).includes(st.system)) role[n] = 'creates';
        else if (own.some(c => w.has(c))) role[n] = 'changes';
        else if (own.some(c => rd.has(c))) role[n] = 'reads';
      }
    }
    const applySystem = () => {
      node.selectAll('.badge').remove();
      if (!st.system) return;
      node.classed('faded', d => !role[d.id]);
      edge.classed('faded', d => !(role[d.source.id] && role[d.target.id]));
      node.filter(d => role[d.id]).append('text').attr('class', 'badge').attr('text-anchor', 'middle')
        .attr('dy', d => -radius(d.id) - 6).style('fill', d => role[d.id] === 'reads' ? 'var(--muted)' : 'var(--ink)').text(d => role[d.id]);
    };
    const near = id => { const s = new Set([id]); links.forEach(l => { if (l.source.id === id) s.add(l.target.id); if (l.target.id === id) s.add(l.source.id); }); return s; };
    const highlight = id => {
      if (!id) { node.classed('faded', false); edge.classed('faded', false); applySystem(); return; }
      const s = near(id);
      node.classed('faded', d => !s.has(d.id));
      edge.classed('faded', d => d.source.id !== id && d.target.id !== id);
    };
    const flyTo = d => {
      hide(); highlight(null);
      const k = 1.8;
      svg.transition().duration(ms(320)).call(zoom.transform, d3.zoomIdentity.translate(W() / 2 - k * d.x, H() / 2 - k * d.y).scale(k))
        .on('end', () => focusView(d.id));
      if (reduceMotion) focusView(d.id);
    };
    const tipFor = d => d.singleton ? singletonTip(d.id) : st.system && role[d.id] ? systemTip(d.id, role[d.id]) : entityTip(d.id);
    node.on('dblclick', (ev, d) => { ev.stopPropagation(); d.userPinned = false; d.fx = null; d.fy = null; d3.select(ev.currentTarget).classed('pinned', false); sim.alpha(0.3).restart(); })
      .on('keydown', (ev, d) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); focusView(d.id); } });

    if (sim) sim.stop();
    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(cfg.linkLen).strength(0.18))
      .force('charge', d3.forceManyBody().strength(-620 * cfg.spacing).distanceMax(700 * Math.max(1, cfg.spacing)))
      .force('y', d3.forceY(d => bandY[d.layer] * BAND).strength(0.45))
      .force('x', d3.forceX(0).strength(0.08))
      .force('collide', d3.forceCollide(d => radius(d.id) + 34))
      .stop();
    for (let i = 0; i < 400; i++) sim.tick();  // settle before the first frame

    // ---- cursor lens, repulsion, snap ----
    // Layout space is d.x/d.y (physics). Display space is d.px/d.py/d.pz, recomputed every frame through the lens.
    // The lens never writes x/y; repulsion only changes velocities; snapping and hit-testing use display space.
    const mouse = { x: 0, y: 0, sx: 0, sy: 0, inside: false };   // layout + screen
    const lens = { x: 0, y: 0, s: 0 };
    let snapped = null, drag = null, dragFrom = null, dragMoved = false, focusId = null, edgeHover = false;
    const kNow = () => d3.zoomTransform(svg.node()).k;
    const fisheye = (x, y, m, R) => {
      const dx = x - lens.x, dy = y - lens.y, dd = Math.hypot(dx, dy);
      if (!dd || dd >= R || m <= 0) return [x, y, 1];
      const e = Math.exp(m), k0 = e / (e - 1) * R, k1 = m / R;
      const k = k0 * (1 - Math.exp(-dd * k1)) / dd * 0.75 + 0.25;
      return [lens.x + dx * k, lens.y + dy * k, Math.min(k, 10)];
    };
    const gauss = (x, y, m, R) => {
      const dx = x - lens.x, dy = y - lens.y, d2 = dx * dx + dy * dy, sg = R / 2, g = Math.min(m / 4, 2) * Math.exp(-d2 / (2 * sg * sg));
      return [lens.x + dx * (1 + g), lens.y + dy * (1 + g), 1 + g * 1.5];
    };
    const hyper = (x, y, m, Rpx) => {
      const dx = x - lens.x, dy = y - lens.y, d = Math.hypot(dx, dy);
      if (!d || m <= 0) return [x, y, 1];
      const R = Math.max(W(), H()) / kNow() * 0.75, c = R / (1 + m * (cfg.lensRadius / 180));
      const t = Math.tanh(d / c) * R / d, sb = 1 - lens.s, k = sb + (1 - sb) * t;
      const local = (R / c) / Math.cosh(d / c) ** 2;
      return [lens.x + dx * k, lens.y + dy * k, Math.max(0.35, sb + (1 - sb) * Math.min(local, 6))];
    };
    const project = () => {
      const mode = drag ? 'off' : cfg.lensMode, R = cfg.lensRadius / kNow();
      const f = mode === 'soft' ? gauss : mode === 'hyperbolic' ? hyper : mode === 'fisheye' ? fisheye : null;
      const m = mode === 'hyperbolic' ? cfg.lensStrength : cfg.lensStrength * lens.s;
      for (const d of nodes) { const p = f ? f(d.x, d.y, m, R) : [d.x, d.y, 1]; d.px = p[0]; d.py = p[1]; d.pz = p[2]; }
    };
    const drawnR = d => radius(d.id) * Math.sqrt(d.pz || 1);
    const screenGap = d => (Math.hypot(d.px - mouse.x, d.py - mouse.y) - drawnR(d)) * kNow();  // px from cursor to the drawn edge
    const nearest = () => { let best = null, bd = Infinity; for (const d of nodes) { const g = screenGap(d); if (g < bd) { best = d; bd = g; } } return [best, bd]; };
    const setSnap = d => {
      if (d === snapped) return;
      if (snapped && snapped !== drag && !snapped.userPinned) { snapped.fx = null; snapped.fy = null; }
      snapped = d;
      if (snapped && !snapped.userPinned) { snapped.fx = snapped.x; snapped.fy = snapped.y; }  // so physics can't slide it away
    };
    const updateSnap = () => {
      if (drag) return;
      if (!cfg.snapOn || !mouse.inside) { setSnap(null); return; }
      const reach = cfg.snapDist;
      if (snapped) {
        const g = screenGap(snapped);
        if (g > reach * 1.7) setSnap(null);
        else { const [n, ng_] = nearest(); if (n !== snapped && ng_ < reach * 0.5 && ng_ < g - 6) setSnap(n); return; }
      }
      const [n, g] = nearest(); if (g < reach) setSnap(n);
    };
    sim.force('push', alpha => {   // repulsion: clears space around the cursor; links spring nodes back
      if (!cfg.pushOn || !mouse.inside || drag) return;
      const k = kNow(), R = cfg.lensRadius * 0.6 / k, strength = cfg.pushStrength * 0.9 / k;
      for (const d of nodes) {
        if (d === snapped || d.fx != null) continue;
        const dx = d.x - lens.x, dy = d.y - lens.y, dd = Math.hypot(dx, dy) || 0.01;
        if (dd > R) continue;
        const f = strength * (1 - dd / R) ** 2 * alpha * 4;
        d.vx += dx / dd * f; d.vy += dy / dd * f;
      }
    });
    const ov = content.append('g').attr('class', 'lens-ov').style('pointer-events', 'none');
    const ring = ov.append('circle').attr('fill', 'none').style('stroke', 'var(--ink)').attr('stroke-width', 2).attr('vector-effect', 'non-scaling-stroke').attr('display', 'none');
    const tether = ov.append('line').style('stroke', 'var(--ink)').attr('stroke-width', 1).attr('stroke-dasharray', '3 3').attr('opacity', 0.35).attr('vector-effect', 'non-scaling-stroke').attr('display', 'none');
    const tipAtNode = d => {
      const t = d3.zoomTransform(svg.node()), [x, y] = t.apply([d.px, d.py]), r = drawnR(d) * t.k;
      tip.innerHTML = tipFor(d); tip.hidden = false;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let lx = x + r + 14, ly = y - 10;
      if (lx + w > W() - 8) lx = Math.max(8, x - r - 14 - w);
      ly = Math.max(8, Math.min(ly, H() - h - 8));
      tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
    };
    const pointer = ev => { const [sx, sy] = d3.pointer(ev, svg.node()), t = d3.zoomTransform(svg.node()), [x, y] = t.invert([sx, sy]); return { sx, sy, x, y }; };
    svg.on('pointermove.atlas', ev => {
      const p = pointer(ev);
      if (!mouse.inside) { lens.x = p.x; lens.y = p.y; }
      Object.assign(mouse, p, { inside: true });
      if (drag) {
        if (Math.hypot(p.sx - dragFrom[0], p.sy - dragFrom[1]) > 4) dragMoved = true;
        if (dragMoved) { drag.fx = p.x; drag.fy = p.y; sim.alphaTarget(0.25).restart(); }
        return;
      }
      if (cfg.pushOn) sim.alphaTarget(0.12).restart();
    }).on('pointerleave.atlas', () => {
      mouse.inside = false;
      if (!drag) { setSnap(null); sim.alphaTarget(0); }
    }).on('pointerdown.atlas', ev => {
      if (ev.button) return;
      const p = pointer(ev); Object.assign(mouse, p, { inside: true });
      const [n, g] = nearest();
      const grab = (cfg.snapOn && snapped) || (g < 4 ? n : null);
      if (!grab) return;
      drag = grab; dragFrom = [p.sx, p.sy]; dragMoved = false; grabbing = true; hide();
      svg.node().setPointerCapture(ev.pointerId);
    });
    const endDrag = () => {
      if (!drag) return;
      const d = drag; drag = null; grabbing = false;
      if (!dragMoved) { if (!d.singleton) flyTo(d); }
      else { d.userPinned = true; d.fx = d.x; d.fy = d.y; node.filter(x => x === d).classed('pinned', true); }
      sim.alphaTarget(mouse.inside && cfg.pushOn ? 0.12 : 0);
    };
    svg.on('pointerup.atlas', endDrag).on('pointercancel.atlas', endDrag);
    edge.on('mouseenter', (ev, d) => { if (focusId || drag) return; edgeHover = true; show(relTip(d.r), ev); edge.classed('faded', e => e !== d); node.classed('faded', n => n.id !== d.source.id && n.id !== d.target.id); })
      .on('mousemove', ev => { if (edgeHover) placeTip(ev); })
      .on('mouseleave', () => { if (!edgeHover) return; edgeHover = false; hide(); edge.classed('faded', false); node.classed('faded', false); applySystem(); });

    const gen = ++viewGen;
    const frame = () => {
      if (gen !== viewGen || st.view !== 'overview') return;
      updateSnap();
      const tx = snapped ? snapped.x : mouse.x, ty = snapped ? snapped.y : mouse.y;
      const a = reduceMotion ? 1 : Math.min(1, cfg.lensFollow * (snapped ? 1.6 : 1));
      lens.x += (tx - lens.x) * a; lens.y += (ty - lens.y) * a;
      lens.s += ((mouse.inside && cfg.lensMode !== 'off' ? 1 : 0) - lens.s) * (reduceMotion ? 1 : 0.12);
      project();
      // focus: the snapped node, or with snap off the node under the cursor
      let f = drag || (cfg.snapOn ? snapped : null);
      if (!f && !cfg.snapOn && mouse.inside) { const [n, g] = nearest(); if (g <= 0) f = n; }
      const fid = f ? f.id : null;
      if (fid !== focusId) {
        focusId = fid; edgeHover = false;
        highlight(fid);
        if (!fid) hide();
      }
      if (f && !drag) tipAtNode(f);
      // draw through the lens, magnified nodes on top
      edge.each(function (d) {
        const bend = 18 * (d.r._i - 1) + (d.r._i > 1 ? 10 : 6);
        const p = edgePath(d.source.px, d.source.py, d.target.px, d.target.py, drawnR(d.target) + 4, bend);
        const g = d3.select(this);
        g.selectAll('path').attr('d', p.d);
        g.select('text').attr('x', p.lx).attr('y', p.ly - 3);
      });
      node.attr('transform', d => `translate(${d.px},${d.py}) scale(${Math.min(3, Math.sqrt(d.pz || 1))})`);
      node.sort((p, q) => (p.pz || 1) - (q.pz || 1));
      if (f) {
        ring.attr('display', null).attr('cx', f.px).attr('cy', f.py).attr('r', drawnR(f) + 4 / kNow());
        if (!drag && cfg.snapOn) tether.attr('display', null).attr('x1', mouse.x).attr('y1', mouse.y).attr('x2', f.px).attr('y2', f.py);
        else tether.attr('display', 'none');
      } else { ring.attr('display', 'none'); tether.attr('display', 'none'); }
      requestAnimationFrame(frame);
    };
    project();
    requestAnimationFrame(frame);
    sim.alpha(0.02).restart();
    legend(['ownership', 'registry', 'directed', 'attachment', 'classifier'], null, true);
    applySystem();
    if (st.system) systemPanel(st.system, role); else overviewPanel();
    try { history.replaceState(null, '', st.system ? '#sys.' + st.system : location.pathname); } catch (e) {}
    setTimeout(() => fit(0), 30);
  }

  // ---------------- focus (drill-in) ----------------
  function card(g, x, y, w, lines, opts) {
    const c = g.append('g').attr('class', 'card' + (opts.center ? ' center' : '') + (opts.go ? ' link' : '')).attr('transform', `translate(${x},${y})`);
    const h = 30 + lines.length * 16 + (opts.meta ? 16 : 0) + 6;
    c.append('rect').attr('class', 'box').attr('x', -w / 2).attr('y', 0).attr('width', w).attr('height', h).attr('rx', 6)
      .style('stroke', opts.stroke || null).style('fill', opts.fill || null);
    c.append('text').attr('class', 'title').attr('x', -w / 2 + 12).attr('y', 21).text(opts.title);
    let yy = 21;
    if (opts.meta) { yy += 16; c.append('text').attr('class', 'meta').attr('x', -w / 2 + 12).attr('y', yy).text(opts.meta); }
    lines.forEach(ln => { yy += 16; c.append('text').attr('class', 'field' + (ln.shared ? ' shared' : '')).attr('x', -w / 2 + 12).attr('y', yy).text(ln.text); });
    if (opts.go) c.attr('tabindex', 0).attr('role', 'button').attr('aria-label', 'Open ' + opts.go)
      .on('click', ev => { ev.stopPropagation(); focusView(opts.go); })
      .on('keydown', ev => { if (ev.key === 'Enter') focusView(opts.go); });
    if (opts.tip) c.on('mouseenter mousemove', ev => show(opts.tip(), ev)).on('mouseleave', hide);
    return { g: c, x, y, w, h };
  }
  const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

  function focusView(n, sub) {
    if (!E[n]) return;
    st.view = 'focus'; st.sel = n; hide(); showTab('details');
    if (sim) sim.stop();
    root.selectAll('*').remove(); fitTarget = null;
    document.getElementById('crumb').hidden = false; wrap.classList.add('focus');
    document.getElementById('crumb-name').textContent = n;
    const e = E[n], ro = relsOf(n);
    const out = ro.out.filter(r => st.rel.has(r.l.type)), inn = ro.in.filter(r => st.rel.has(r.l.type));
    const subs = st.rel.has('keyed') ? subsOf(n) : [];
    const eg = root.append('g'), cg = root.append('g');
    const own = new Set(uniqueFields(n));
    const idLine = Object.entries(e.id || {}).map(([k, v]) => `${k} id: ${v}`);
    const fields = (e.components || []).map(c => ({ text: (own.has(c) ? '● ' : '○ ') + c + ((comps[c] || {}).type ? ' : ' + comps[c].type : ''), shared: !own.has(c) }));
    const center = card(cg, 0, 0, 300, fields, { center: true, title: n + (e.extends ? ' (extends ' + e.extends + ')' : ''), meta: trunc(idLine[0] || (e.index ? 'index: ' + e.index : 'id: not hashed'), 44),
      stroke: `var(--${e.layer})`, tip: () => entityTip(n) });
    const cx = 0, cyMid = center.h / 2;

    const colX = 420, rowH = 70;
    const place = (items, x, label) => {
      if (!items.length) return [];
      cg.append('text').attr('class', 'col-label').attr('x', x).attr('y', -34).attr('text-anchor', 'middle').text(label);
      const top = cyMid - (items.length * rowH) / 2;
      return items.map((r, i) => ({ r, x, y: top + i * rowH }));
    };
    const outs = place(out, colX, 'Stores a reference to');
    const ins = place(inn, -colX, 'Referenced by');
    const drawRel = (p, dir) => {
      const other = dir === 'out' ? (p.r.to || 'unresolved') : p.r.from;
      const isEnt = !!E[other];
      const c = card(cg, p.x, p.y, 200, [], { title: other, meta: isEnt ? LAYER_NAME[E[other].layer] : (p.r.to ? 'not a game entity' : 'target not resolved'),
        go: isEnt ? other : null, stroke: isEnt ? `var(--${E[other].layer})` : 'var(--line)', tip: isEnt ? () => entityTip(other) : null });
      const midY = p.y + c.h / 2;
      const [sx, sy, tx, ty] = dir === 'out' ? [cx + 150, cyMid, p.x - 100, midY] : [p.x + 100, midY, cx - 150, cyMid];
      const path = edgePath(sx, sy, tx, ty, 2, 0);
      const g = eg.append('g').attr('class', 'edge ' + (p.r.l.required ? 'required' : 'optional'));
      g.append('path').attr('class', 'line').attr('d', path.d).style('stroke', `var(--r-${p.r.l.type})`).attr('marker-end', `url(#m-${p.r.l.type})`);
      g.append('path').attr('class', 'hit').attr('d', path.d);
      g.append('text').attr('class', 'lbl').attr('x', path.lx).attr('y', path.ly - 5).attr('text-anchor', 'middle')
        .style('fill', `var(--r-${p.r.l.type})`).text(p.r.comp + (p.r.l.required ? '' : ' (optional)'));
      g.on('mouseenter mousemove', ev => show(relTip(p.r), ev)).on('mouseleave', hide);
    };
    outs.forEach(p => drawRel(p, 'out'));
    ins.forEach(p => drawRel(p, 'in'));

    // sub-entities below, keyed from the parent
    if (subs.length) {
      const per = 3, w = 250, gapX = 24, top = Math.max(center.h, 0) + 110;
      cg.append('text').attr('class', 'col-label').attr('x', 0).attr('y', top - 40).attr('text-anchor', 'middle').text('Sub-entities, keyed by this entity');
      subs.forEach((x, i) => {
        const col = i % per, row = Math.floor(i / per);
        const cols = Math.min(per, subs.length - row * per);
        const px = (col - (cols - 1) / 2) * (w + gapX);
        const keyLine = x.s.keys ? 'keys: ' + Object.keys(x.s.keys).join(', ') : '';
        const whatLine = (NS[x.ns] || {}).what || '';
        const lines = [{ text: trunc(subKindLine(x), 36) }, whatLine && { text: trunc(whatLine, 36), shared: true }, keyLine && { text: trunc(keyLine, 36), shared: true }].filter(Boolean);
        const py = top + row * 108;
        const c = card(cg, px, py, w, lines, { title: x.ns, meta: x.shared ? 'shared with ' + arr(x.s.held_by).filter(h => h !== n).join(', ') : '', stroke: `var(--r-keyed)`, tip: () => subTip(x, n) });
        if (x.s.kind === 'anchor key') c.g.select('rect').style('stroke-dasharray', '5 4');
        if (row === 0) {
          const path = edgePath(0, center.h, px, py, 2, 0);
          const g = eg.append('g').attr('class', 'edge required');
          g.append('path').attr('class', 'line').attr('d', path.d).style('stroke', 'var(--r-keyed)').attr('marker-end', 'url(#m-keyed)');
          g.append('path').attr('class', 'hit').attr('d', path.d);
          g.on('mouseenter mousemove', ev => show(subTip(x, n), ev)).on('mouseleave', hide);
        }
        if (sub === x.ns) c.g.select('rect').style('stroke-width', 3);
      });
    }
    const usedTypes = [...new Set(out.concat(inn).map(r => r.l.type))];
    legend(usedTypes.concat(subs.length ? ['keyed'] : []), `● field unique to ${esc(n)} · ○ shared`);
    focusPanel(n, sub);
    try { history.replaceState(null, '', '#' + n); } catch (e) {}
    setTimeout(() => fit(350), 30);
  }

  // ---------------- panel ----------------
  const entBtn = n => E[n] ? `<button class="ent" data-go="${esc(n)}">${esc(n)}</button>` : `<code>${esc(n)}</code>`;
  function overviewPanel() {
    const counts = LAYERS.map(l => [l, Object.values(E).filter(e => e.layer === l).length]);

      <section class="block"><h3>In this model</h3><div class="kv">
        ${counts.map(([l, c]) => `<span class="k">${esc(LAYER_NAME[l])}</span><span>${c} entity types</span>`).join('')}
        <span class="k">Untyped shapes</span><span>${Object.keys(E).filter(n => E[n].typed === false).join(', ') || 'none'} <span class="muted">(dashed)</span></span>
        <span class="k">Relationships</span><span>${rels.length} stored references</span>

      <section class="block"><h3>Relationship types</h3><ul class="plain">${Object.keys(REL_NAME).map(t =>
        `<li><span class="swatch" style="background:var(--r-${t})"></span> <b>${esc(REL_NAME[t])}</b> <span class="muted">${rels.filter(r => r.l.type === t).length || ''}</span><div class="muted small">${esc(RT[t] || '')}</div></li>`).join('')}</ul>
        <p class="muted small" style="margin-top:8px">Arrows run from the entity that stores the reference to the one it references. Solid lines are set every time the entity is created; dashed lines only under a condition.</p></section>
      <section class="block"><h3>Start with</h3><div class="chips">${['ACCOUNT', 'KAMI', 'HARVEST', 'NODE', 'ITEM', 'QUEST', 'CONDITION'].filter(x => E[x]).map(entBtn).join(' ')}</div></section>
      <section class="block"><h3>Or a system</h3><div class="chips">${['HarvestStart', 'HarvestLiquidate', 'KamiGachaMint', 'QuestComplete', 'Craft'].filter(x => systems[x]).map(sysBtn).join(' ')}</div></section>
      ${Object.keys(SG).length ? `<section class="block"><h3>Singletons (${Object.keys(SG).length})</h3><ul class="plain">${Object.entries(SG).map(([n, g]) =>
        `<li><code>${esc(n)}</code> <span class="muted small">${esc(g.id)} · used in ${arr(g.used_in).map(esc).join(', ')}</span></li>`).join('')}</ul>
        <p class="muted small" style="margin:6px 0 0">One entity at a fixed id. Those an entity points at appear on the map as diamonds.</p></section>` : ''}
      ${arr(notes.open_questions).length ? `<section class="block"><h3>Open questions</h3><ul class="plain">${arr(notes.open_questions).map(q => '<li class="muted small">' + esc(q) + '</li>').join('')}</ul></section>` : ''}`;
  }
  const sysBtn = n => `<button class="sysbtn" data-sys="${esc(n)}" title="Show what ${esc(n)} touches">${esc(n)}</button>`;
  const GH = 'https://github.com/Asphodel-OS/kami-atlas/blob/main/generated/systems/';
  function systemPanel(n, role) {
    const sy = systems[n] || {};
    const by = r => Object.keys(role).filter(k => role[k] === r).sort();
    const sec = (title, xs) => xs.length ? `<section class="block"><h3>${title} (${xs.length})</h3><div class="chips">${xs.map(entBtn).join(' ')}</div></section>` : '';
    panel.innerHTML = `<span class="pill" style="background:var(--muted)">System</span>
      <h2>${esc(n)}</h2>
      ${sy.comment ? `<p class="what">${esc(sy.comment)}</p>` : ''}
      <section class="block"><div class="kv">
        ${sy.args ? `<span class="k">args</span><code>${esc(sy.args)}</code>` : ''}
        ${arr(sy.events).length ? `<span class="k">events</span><span>${arr(sy.events).map(x => '<code>' + esc(x) + '</code>').join(', ')}</span>` : ''}
        ${arr(sy.config).length ? `<span class="k">config</span><span>${arr(sy.config).map(x => '<code>' + esc(x) + '</code>').join(', ')}</span>` : ''}
        <span class="k">full detail</span><a href="${GH}${encodeURIComponent(n)}.yaml" target="_blank" rel="noopener">generated/systems/${esc(n)}.yaml</a>
      </div></section>
      ${sec('Creates', by('creates'))}${sec('Changes', by('changes'))}${sec('Reads', by('reads'))}
      <section class="block"><h3>Writes (${arr(sy.writes).length} components)</h3><div class="chips">${arr(sy.writes).map(c => `<span class="cmp ${compUse[c] && compUse[c].length === 1 ? 'own' : ''}">${esc(c)}</span>`).join('')}</div>

  }
  function relRow(r, dir) {

    return `<div class="rel"><div class="head"><span class="swatch" style="background:var(--r-${l.type})"></span>
      <code>${esc(r.comp)}</code> ${dir === 'out' ? '→' : '←'} ${other ? entBtn(other) : '<span class="tag warn">unresolved</span>'}
      <span class="tag">${esc(REL_NAME[l.type])}</span><span class="tag">${l.required ? 'required' : 'optional'}</span>

  function focusPanel(n, sub) {

      <section class="block"><h3>Fields set at creation (${(e.components || []).length})</h3><div class="chips">${arr(e.components).map(c =>
        `<span class="cmp ${compUse[c].length === 1 ? 'own' : ''}" title="${esc((comps[c] || {}).type || '')}">${esc(c)}</span>`).join('')}</div>
        <p class="muted small" style="margin:6px 0 0">Outlined: no other entity type uses it.</p></section>`;
    panel.scrollTop = 0;
  }
  panel.addEventListener('click', ev => {
    const s_ = ev.target.closest('[data-sys]'); if (s_) { showTab('details'); overviewView(s_.dataset.sys); return; }
    const b = ev.target.closest('[data-go]'); if (b) focusView(b.dataset.go);
  });

  // ---------------- search ----------------
  const q = document.getElementById('q'), res = document.getElementById('results');
  const index = [];
  for (const [n, e] of Object.entries(E)) {
    index.push({ label: n, kind: LAYER_NAME[e.layer].toLowerCase(), go: n });
    for (const ns of Object.keys(e.sub_entities || {})) index.push({ label: ns, kind: 'sub-entity of ' + n, go: n, sub: ns });
    for (const s of arr(e.created_by)) index.push({ label: s, kind: 'creates ' + n, go: n });
  }
  for (const [ns, s] of Object.entries(model.shared_sub_entities || {})) for (const h of arr(s.held_by)) if (E[h]) index.push({ label: ns, kind: 'shared, on ' + h, go: h, sub: ns });
  for (const n of Object.keys(systems)) if (!n.startsWith('__')) index.push({ label: n, kind: 'system', system: n });
  for (const c of Object.keys(compUse)) index.push({ label: c, kind: compUse[c].length === 1 ? 'field of ' + compUse[c][0] : 'field on ' + compUse[c].length + ' entities', go: compUse[c][0] });
  let hits = [], hi = 0;
  const renderHits = () => { res.hidden = !hits.length; res.innerHTML = hits.map((h, i) => `<button class="${i === hi ? 'on' : ''}" data-i="${i}">${esc(h.label)}<em>${esc(h.kind)}</em></button>`).join(''); };
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase(); hi = 0;
    hits = t ? index.filter(x => x.label.toLowerCase().includes(t)).sort((a, b) => a.label.toLowerCase().indexOf(t) - b.label.toLowerCase().indexOf(t)).slice(0, 12) : [];
    renderHits();
  });
  q.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { hi = Math.min(hi + 1, hits.length - 1); renderHits(); ev.preventDefault(); }
    if (ev.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); renderHits(); ev.preventDefault(); }
    if (ev.key === 'Enter' && hits[hi]) pick(hits[hi]);

  });
  res.addEventListener('click', ev => { const b = ev.target.closest('[data-i]'); if (b) pick(hits[+b.dataset.i]); });
  const pick = h => { hits = []; renderHits(); q.value = ''; if (h.system) { showTab('details'); overviewView(h.system); } else focusView(h.go, h.sub); };
  document.addEventListener('click', ev => { if (!ev.target.closest('.search')) { hits = []; renderHits(); } });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (st.view === 'focus' || st.system) && document.activeElement !== q) overviewView(); });

  // ---------------- controls ----------------
  const press = (id, on) => document.getElementById(id).setAttribute('aria-pressed', on ? 'true' : 'false');
  for (const l of LAYERS) document.getElementById('f-' + l).addEventListener('click', () => {
    if (st.layers.has(l) && st.layers.size > 1) st.layers.delete(l); else st.layers.add(l);
    LAYERS.forEach(x => press('f-' + x, st.layers.has(x)));
    saveSettings(); overviewView(st.system);
  });
  // side panel: tabs and collapse
  const side = document.querySelector('.main'), tabD = document.getElementById('tab-details'), tabS = document.getElementById('tab-settings');
  const setsEl = document.getElementById('settings');
  function showTab(t) {
    tabD.setAttribute('aria-selected', t === 'details'); tabS.setAttribute('aria-selected', t === 'settings');
    panel.hidden = t !== 'details'; setsEl.hidden = t !== 'settings';
  }
  tabD.addEventListener('click', () => showTab('details'));
  tabS.addEventListener('click', () => showTab('settings'));
  function setCollapsed(c) {
    cfg.collapsed = c; saveSettings();
    side.classList.toggle('collapsed', c);
    document.getElementById('expand').hidden = !c;
    setTimeout(() => fit(0), 30);
  }
  document.getElementById('collapse').addEventListener('click', () => setCollapsed(true));
  document.getElementById('expand').addEventListener('click', () => setCollapsed(false));
  document.addEventListener('keydown', ev => {
    if (ev.key === ']' && !(ev.target.closest && ev.target.closest('input'))) { setCollapsed(!cfg.collapsed); ev.preventDefault(); }
  });

  // settings
  const relChips = document.getElementById('set-rels');
  relChips.innerHTML = Object.keys(REL_NAME).map(t => `<button class="chip" data-rel="${t}" aria-pressed="${st.rel.has(t)}"><span class="dot" style="background:var(--r-${t})"></span>${esc(REL_NAME[t])}</button>`).join('');
  const redraw = () => { if (st.view === 'focus' && st.sel) focusView(st.sel); else overviewView(st.system); };
  relChips.addEventListener('click', ev => {
    const b = ev.target.closest('[data-rel]'); if (!b) return;
    const t = b.dataset.rel;
    if (st.rel.has(t)) st.rel.delete(t); else st.rel.add(t);
    b.setAttribute('aria-pressed', st.rel.has(t)); saveSettings(); redraw();
  });
  function applyLabels() {
    svg.classed('lbl-off', cfg.edgeLabels === 'off').classed('lbl-on', cfg.edgeLabels === 'on').classed('names-off', !cfg.names);
    document.querySelectorAll('#set-lbl button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cfg.edgeLabels));
    document.getElementById('set-names').checked = cfg.names;
  }
  document.getElementById('set-lbl').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (!b) return; cfg.edgeLabels = b.dataset.v; saveSettings(); applyLabels(); });
  document.getElementById('set-names').addEventListener('change', ev => { cfg.names = ev.target.checked; saveSettings(); applyLabels(); });
  const ranges = [['set-spacing', 'out-spacing', 'spacing', v => v.toFixed(1) + '×'], ['set-link', 'out-link', 'linkLen', v => String(v)]];
  for (const [id, outId, key, fmt] of ranges) {
    const el = document.getElementById(id), out = document.getElementById(outId);
    el.value = cfg[key]; out.textContent = fmt(+cfg[key]);
    el.addEventListener('input', () => { out.textContent = fmt(+el.value); });
    el.addEventListener('change', () => { cfg[key] = +el.value; saveSettings(); if (st.view === 'overview') overviewView(st.system); });
  }
  const live = [['set-lstr', 'out-lstr', 'lensStrength', v => v.toFixed(1)], ['set-lrad', 'out-lrad', 'lensRadius', v => v + 'px'],
    ['set-lfol', 'out-lfol', 'lensFollow', v => v.toFixed(2)], ['set-pstr', 'out-pstr', 'pushStrength', v => v.toFixed(1)], ['set-sdist', 'out-sdist', 'snapDist', v => v + 'px']];
  function applyCursor() {
    for (const [id, outId, key, fmt] of live) { document.getElementById(id).value = cfg[key]; document.getElementById(outId).textContent = fmt(+cfg[key]); }
    document.querySelectorAll('#set-lens button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cfg.lensMode));
    document.getElementById('set-push').checked = cfg.pushOn; document.getElementById('set-snap').checked = cfg.snapOn;
  }
  for (const [id, outId, key, fmt] of live) {
    const el = document.getElementById(id);
    el.addEventListener('input', () => { cfg[key] = +el.value; document.getElementById(outId).textContent = fmt(+el.value); });
    el.addEventListener('change', saveSettings);
  }
  document.getElementById('set-lens').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (!b) return; cfg.lensMode = b.dataset.v; saveSettings(); applyCursor(); });
  document.getElementById('set-push').addEventListener('change', ev => { cfg.pushOn = ev.target.checked; saveSettings(); });
  document.getElementById('set-snap').addEventListener('change', ev => { cfg.snapOn = ev.target.checked; saveSettings(); });
  document.getElementById('set-reheat').addEventListener('click', () => { if (sim && st.view === 'overview') sim.alpha(0.8).restart(); });
  document.getElementById('set-unpin').addEventListener('click', () => {
    if (st.view !== 'overview') return;
    d3.selectAll('#svg .node').each(d => { if (d) { d.userPinned = false; d.fx = null; d.fy = null; } }).classed('pinned', false);
    if (sim) sim.alpha(0.3).restart();
  });
  function applyOverlays() {
    document.getElementById('legend').hidden = !cfg.legend; document.getElementById('hint').hidden = !cfg.hint;
    document.getElementById('set-legend').checked = cfg.legend; document.getElementById('set-hint').checked = cfg.hint;
  }
  document.getElementById('set-legend').addEventListener('change', ev => { cfg.legend = ev.target.checked; saveSettings(); applyOverlays(); });
  document.getElementById('set-hint').addEventListener('change', ev => { cfg.hint = ev.target.checked; saveSettings(); applyOverlays(); });
  document.getElementById('set-reset').addEventListener('click', () => {
    Object.assign(cfg, DEFAULTS); st.layers = new Set(LAYERS); st.rel = new Set(DEFAULTS.rel);
    LAYERS.forEach(x => press('f-' + x, true));
    relChips.querySelectorAll('[data-rel]').forEach(b => b.setAttribute('aria-pressed', 'true'));
    ranges.forEach(([id, outId, key, fmt]) => { document.getElementById(id).value = cfg[key]; document.getElementById(outId).textContent = fmt(+cfg[key]); });
    saveSettings(); applyLabels(); applyOverlays(); applyCursor(); setCollapsed(false); redraw();
  });
  LAYERS.forEach(x => press('f-' + x, st.layers.has(x)));
  applyLabels(); applyOverlays(); applyCursor();
  if (cfg.collapsed) setCollapsed(true);

  document.getElementById('back').addEventListener('click', () => overviewView());
  document.getElementById('fit').addEventListener('click', () => fit());
  document.getElementById('zin').addEventListener('click', () => zoomBy(1.35));
  document.getElementById('zout').addEventListener('click', () => zoomBy(1 / 1.35));
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('input')) return;
    if (ev.key === '+' || ev.key === '=') { zoomBy(1.35); ev.preventDefault(); }
    else if (ev.key === '-' || ev.key === '_') { zoomBy(1 / 1.35); ev.preventDefault(); }
    else if (ev.key === '0') { fit(); ev.preventDefault(); }
    else if (ev.key === '/') { q.focus(); ev.preventDefault(); }
  });
  svg.on('click', ev => { if (ev.target === svg.node()) hide(); });
  window.addEventListener('resize', () => setTimeout(() => fit(0), 100));

  // ---------------- go ----------------
  document.getElementById('sourceline').textContent = `Kamigotchi World · ${Object.keys(E).length} entity types · ${rels.length} relationships · ${Object.keys(systems).length} systems · generated from the contracts`;
  const start = decodeURIComponent((location.hash || '').slice(1));
  if (E[start]) focusView(start); else if (start.startsWith('sys.') && systems[start.slice(4)]) overviewView(start.slice(4)); else overviewView();
})();
</script>
