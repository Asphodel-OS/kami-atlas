# Data logs: the counters LibData keeps at is.data(holderID, index, type). The generator finds every write and read in
# the contracts (generated/data-logs.yaml); these notes say what the families mean. Flow mappings, one per line.

families:
  HARVEST: {what: "Harvesting totals per account: time spent (HARVEST_TIME, per node and in total, split by day phase), amounts collected (HARVEST_AT_NODE per node, HARVEST_AFFINITY_* per node affinity, HARVEST_WHEN_* per day phase, keyed by the item collected)."}
  LIQ: {what: "Liquidation totals per account: liquidations by day phase (LIQ_WHEN_*) and the accounts liquidated (LIQ_TARGET_ACC, keyed by the victim's account index)."}
  LIQUIDATE: {what: "Liquidation counts per account: in total, per node, and as the victim (LIQUIDATED_VICTIM)."}
  SCAV: {what: "Scavenging claims per account: per bar (SCAV_CLAIM_NODE, keyed by the node index) and per node affinity (SCAV_CLAIM_AFFINITY_*)."}
  ITEM: {what: "Item flows: ITEM_COUNT is the world total of each item (holder 0, keyed by item index), ITEM_TOTAL an account's lifetime total; ITEM_USE, ITEM_BURN, ITEM_SPEND and ITEM_REVENUE count uses, burns and shop spend/revenue; ACCOUNT_ITEM_USE and KAMI_ITEM_USE split uses by target shape."}
  TRADE: {what: "Player-to-player trades per account: created, executed, completed, cancelled, items received and spent (keyed by item index), and the tax paid."}
  KAMI: {what: "Kami lifecycle per account: gacha mints and rerolls, sends, stakes, sacrifices, market listings and sales, names set, levels gained in total."}
  QUEST: {what: "Quests completed per account, repeatable ones counted separately."}
  MINT: {what: "Gacha ticket mints: public, whitelist and total, per account and for the world (holder 0)."}
  TOKEN: {what: "Onyx spent per account and for the world, in total and per use (revive, respec, rename), keyed by the Onyx item index."}
  PORTAL: {what: "Bridge flows through the token portal: item and token deposits, withdrawals, claims, cancels and tax, per account and for the world; token totals are held by the token address."}
  POOL: {what: "Liquidity pool activity per account: swaps, volume, liquidity added and removed."}
  CRAFT: {what: "Crafting per account: recipes crafted (keyed by recipe index) and items produced."}
  SACRIFICE: {what: "Kami sacrifices per account: items sacrificed and the pity counters for uncommon and rare outcomes."}
  GOAL: {what: "Contributions to community goals per account."}
  KILL: {what: "Bounty balances of a kill log (array data, written by a path no deployed system reaches today)."}
  LISTING: {what: "NPC shop buys and sells per account, in total and per item."}
  DROPTABLE: {what: "Droptable rewards received per account, keyed by item index."}
  SKILL: {what: "Skill points spent per account."}
  MESSAGES: {what: "Chat messages sent per account."}
  MOVE: {what: "Room moves per account."}
  TOTAL: {what: "World totals: the number of registered accounts (holder 0)."}
  GACHA: {what: "Pending gacha commits for the world (holder 0): incremented on commit, reset on reveal."}
  KAMI721: {what: "Kami NFT unstakes per account."}

# per-log notes: `what` is shown in the atlas; `holder` / `index` name what the tracer cannot see (an index array built two
# calls away), values separated by |. Semantics below were established 2026-10-21/22 against the prod copy (see the Item
# Tracking Proposal).
logs:
  ITEM_COUNT: {what: "World supply of the item: every mint increments, every burn decrements. Exact sum of all inventory balances (checked over all 173 items at block 34,770,475). Transfers, trades and gifts leave it unchanged.", holder: world, index: ITEM}
  ITEM_TOTAL: {what: "Items an account earned from the world (minted into its inventory), gross: never decremented. Since PR #2503 trades and gifts do not add to it; before, receivers of trades and gifts were credited and completed trades credited the trade entity itself (47,711 dead records).", holder: "ACCOUNT|TRADE", index: ITEM}
  ITEM_SPEND: {what: "Currency paid to NPC shops, keyed by the currency item (MUSU 1)."}
  ITEM_REVENUE: {what: "Currency received from NPC shops, keyed by the currency item."}
  ITEM_AUCTION_SPEND: {what: "Currency paid in auctions (gacha tickets, Onyx), keyed by the currency item; the largest MUSU sink."}
  ITEM_BURN: {what: "Items destroyed through ItemBurnSystem: quest turn-ins ('Give X'); not crafting inputs, not item use."}
  ITEM_USE: {what: "Items consumed by use, per item index; index 0 is the account's total uses across items."}
  CRAFT_ITEM: {what: "Items produced by crafting, per output item; inputs are not logged.", index: ITEM}
  CRAFT_TOTAL: {what: "Crafts per recipe."}
  GOAL_CONTRIBUTION: {what: "Amount contributed to community goals, all goals and all items summed under index 0: the item and the goal are dropped (5 of 11 goals take MUSU). Flagged in the Item Tracking Proposal."}
  TRADE_RECEIVE: {what: "Gross items owed to the account by a trade, before tax, logged at execute for both sides (the taker for the sell items, the maker for the payment)."}
  TRADE_SPEND: {what: "Items the account gave up in a trade, logged at execute."}
  TRADE_TAX: {what: "Tax burned out of the account's trade receipts: taker at execute, maker at complete. Net received = TRADE_RECEIVE - TRADE_TAX."}
  TRADE_CREATION_FEE: {what: "MUSU burned as the trade creation fee (config TRADE_CREATION_FEE, 3 on prod). PR #2503."}
  TRADE_DELIVERY_FEE: {what: "MUSU burned as the delivery fee for a trade action outside the trade room (config TRADE_DELIVERY_FEE, 50 on prod). PR #2503."}
  ITEM_TRANSFER_SEND: {what: "Items gifted to another account (ItemTransferSystem); an exchange, not earned. PR #2503."}
  ITEM_TRANSFER_RECEIVE: {what: "Items received as a gift. PR #2503."}
  ITEM_TRANSFER_FEE: {what: "MUSU burned as the gift fee, 15 per item index. PR #2503."}
  POOL_VOLUME: {what: "World-level amount in and out per item over all swaps; there is no per-account volume.", index: ITEM}
  POOL_SWAP_TOTAL: {what: "Swaps per account, count only."}
  TOKEN_SPEND: {what: "Onyx spent on revive, respec and rename, per account and for the world; the world also keeps TOKEN_SPEND_REVIVE / _RESPEC / _RENAME."}
  TOTAL_NUM_ACCOUNTS: {what: "Number of registered accounts; set, not incremented."}
  GACHA_COMMITS_PENDING: {what: "Gacha commits awaiting reveal; incremented on commit, set down on reveal."}
  KAMI_MARKET_BUY: {what: "Kami market purchases, count only; the price (native token) is not logged."}
  DROPTABLE_ITEM_TOTAL: {what: "Items received from droptable reveals, per item.", holder: ACCOUNT, index: ITEM}
  SACRIFICE_ITEM_TOTAL: {what: "Items received from a kami sacrifice, per item.", holder: ACCOUNT, index: ITEM}
  "SCAV_CLAIM_*": {what: "Scavenge claims per field: index 0 for the total and the node index for SCAV_CLAIM_NODE.", index: "0|NODE"}
  "SCAV_CLAIM_AFFINITY_*": {what: "Scavenge claims per node affinity, total only.", index: "0"}
  LIQ_TARGET_ACC: {what: "Liquidations by this account against each victim, keyed by the victim's account index."}
  KILL_BOUNTIES: {what: "Bounty balances of one liquidation (array), on a fresh entity per kill; no deployed system reaches the writer today."}

