# Notes on generated/domain-model.yaml: what the code can't say. The structure (entities, layers, ids, links,
# owners, sub-entities) is generated; this file adds descriptions, resolves links the generator could not, and
# records confirmed facts. The visualizer merges the two.
# DRAFT descriptions by Claude from the code, 2026-10-14. Confirmed by Acheron 2026-10-14 where marked.

terms:
  top-level entity: "Has an EntityType (31), or is an untyped shape (CONDITION, ROOM_GATE, COMMIT): created from the World's id counter with several fields but no EntityType."
  sub-entity: "No EntityType. Its id is keccak256(namespace, keys...), so it lives under a parent and there is one per key. Either a record (components are stored at the id) or an anchor key (nothing is stored at the id; other records point at it to form a group, e.g. a node's requirements are CONDITIONs whose IDAnchor is node.requirement(nodeIndex))."
  layer: "registry = entry made by admin/registry systems; runtime = made by playing; hybrid = one type used for both a registry entry and a player's instance of it (IsRegistry marks the registry entry)"
  links: "Runtime entities point at registry entries by index (IndexItem, IndexRoom, ...) and at other runtime entities by entity id (IDOwns*, IdHolder, IdSource, IdTarget)."

entities:
  ACCOUNT: {what: "A player: owner and operator addresses, a room, stamina, a name."}
  KAMI:
    what: "A pet: stats, level, experience, skill points, a state (RESTING, HARVESTING, DEAD...)."
    confirmed: ["Owner is GACHA_POOL (GACHA_ID) while the kami sits in the gacha pool, then an ACCOUNT. (Acheron)", "Kamis hold no inventory but can have equipment. (Acheron)"]
  HARVEST: {what: "A kami working a node: accrued bounty (Value) and timing. Exactly one per kami, reused across nodes."}
  TAX: {what: "A cut of a harvest paid to a third party, at most 20%.", confirmed: ["For third-party front-ends and guilds or groups. (Acheron)"]}
  EQUIPMENT: {what: "An item equipped on a kami in a slot; one per kami per slot.", confirmed: ["Kamis can have equipment assigned. (Acheron)", "Equipment is for kamis only right now; the account branch in the code comment is unused. (Acheron, 2026-10-17)"]}
  INVENTORY: {what: "How many of one item a holder has: an account, a pool's reserves, or a trade's escrow."}
  TRADE: {what: "A player-to-player item trade; offered items sit in an inventory held by the trade."}
  KAMI_LISTING: {what: "A kami listed for sale."}
  KAMI_OFFER: {what: "An offer on a specific kami."}
  KAMI_COLLECTION_OFFER: {what: "An offer on any kami (Max = how many)."}
  FRIENDSHIP: {what: "A friend request, friendship or block between two accounts (State)."}
  TOKEN_RECEIPT: {what: "A token-portal withdrawal waiting out its delay (config PORTAL_TOKEN_EXPORT_DELAY)."}
  POOL_SHARE: {what: "A holder's share of an item pool."}
  QUEST: {what: "Registry: a quest with objectives, requirements and rewards. Instance: an account's accepted quest."}
  SKILL: {what: "Registry: a skill in the tree. Instance: points a kami (or an account, for account skills) has put into it."}
  RELATIONSHIP: {what: "Registry: a relationship stage with an NPC. Instance: an account's progress in it."}
  ROOM: {what: "A place in the world. Nodes, NPCs, goals and accounts are located by room index."}
  NODE: {what: "A harvestable spot in a room; yields one item and has a scavenge bar."}
  SCAVENGE: {what: "A scavenge bar on a node: points needed and the reward."}
  ITEM: {what: "An item registry entry: requirements, what using it does, what it grants."}
  RECIPE: {what: "A crafting recipe: inputs, outputs, requirements."}
  NPC: {what: "A non-player character in a room; may run a shop and have relationships."}
  LISTING: {what: "An NPC shop entry: an item for sale and its currency."}
  AUCTION: {what: "An item auction priced in a currency item."}
  POOL: {what: "An AMM pool between two items."}
  GOAL: {what: "A community goal in a room, with reward tiers by contribution."}
  FACTION: {what: "A faction players build reputation with."}
  TRAIT: {what: "A kami trait (body, hand, face, color, background) and its stats."}
  BONUS: {what: "A bonus a skill, item or node can grant."}
  ALLOCATION: {what: "A reward or grant attached to a quest, goal, item or node."}
  REFERENCE: {what: "A lookup pointer attached to an anchor."}
  CONDITION: {what: "A requirement or objective (type, logic, index, value) attached to whatever requires it: harvesting a node, using an item, accepting or completing a quest, buying a listing, upgrading a skill, crafting. The game's universal condition record; it has no EntityType."}
  ROOM_GATE: {what: "A condition guarding movement into a room, optionally only when coming from a specific room. No EntityType."}
  COMMIT: {what: "A pending random roll (commit-reveal) that resolves at a future block: gacha mints and rerolls, sacrifices, droptable rewards from items, quests, goals and scavenging. No EntityType; removed once revealed."}

links:   # for links the generator left unresolved (to: null)
  FRIENDSHIP.IdTarget: {to: ACCOUNT, note: "the other account"}
  TRADE.IdTarget: {to: ACCOUNT, note: "the counterparty, if the trade is addressed to one"}
  TAX.IdTarget: {to: "any", note: "whoever receives the cut. As of 2026-10-16 only kamibots (front-end operators); guilds may come later (Acheron)"}
  SKILL.IDOwnsSkill: {to: "KAMI | ACCOUNT", note: "a skill's registry entry says which it is for (its For field); SkillUpgradeSystem checks the holder is that shape, so both kamis and accounts can hold skills. Which skills are account skills is registry data, not code: as of 2026-10-16 there are none (Acheron)."}
  ALLOCATION.IDAnchor: {note: "the reward anchor of a quest, a goal tier, a scavenge bar (not the node itself) or an item use case"}
  ALLOCATION.IdSource: {note: "the registry entry the allocation came from: the goal, quest, scavenge bar or item whose reward it is"}
  BONUS.IdSource: {note: "the registry entry that grants the bonus: a node, a skill, or an item (through the item's bonus allocation). Only item use cases create bonus allocations; nodes, goals and quests don't grant bonuses as rewards, by design (Acheron, 2026-10-16)"}
  KAMI.IDOwnsKami: {note: "GACHA_POOL: unminted kamis belong to the gacha pool constant until they are bought"}
  POOL_SHARE.IdHolder: {note: "POOL: the pool itself holds the locked seed liquidity shares minted at creation"}
  QUEST.IDAnchor: {ignore: true, note: "set on the quest's objective snapshots (snapshot.anchor), not on the quest"}
  FRIENDSHIP.IDAnchor: {ignore: true, note: "set on the friendship counters (friendship.ptr), not on the friendship"}
  TRAIT.IDAnchor: {ignore: true, note: "set on the trait-type reverse lookup (registry.trait.type)"}
  ROOM_GATE.IdSource: {to: ROOM, note: "the source room's index, stored for the client"}

sub_entities:   # descriptions; the parent comes from the generated model unless given here
  faction.reputation: {what: "reputation with a faction"}
  goal.contribution: {what: "what an account has put into a goal"}
  friendship.ptr: {what: "per-account counters by friendship state"}
  sacrifice.pity: {what: "pity counter for kami sacrifice rolls"}
  sacrifice.log: {what: "latest sacrifice result per account per droptable; overwritten on each reveal so the client can show the last roll", held_by: "ACCOUNT"}
  droptable.item.log: {what: "latest droptable result per account per droptable; overwritten on each reveal so the client can show the last roll", held_by: "ACCOUNT"}
  scavenge.instance: {what: "a holder's scavenge points on a node"}
  bonus.instance: {what: "an active bonus on a holder (account or kami)"}
  bonus.type: {what: "a holder's running total for one bonus type"}
  bonus.ending.type: {what: "a holder's bonuses that end on the same trigger (UPON_HARVEST_ACTION, ...)"}
  quest.objective.snapshot: {what: "progress baseline taken when a quest is accepted"}
  is.data: {what: "stat counters, any holder"}
  is.score: {what: "leaderboard score per epoch, any holder"}
  has.flag: {what: "a boolean flag on an entity: NOT_NAMEABLE on a kami, CAN_RESET_SKILLS on a kami or account, REPEATABLE on a quest, admin flags on items and rooms; WORLD_WHITELIST is set on a raw wallet address, not an entity", held_by: "ACCOUNT | KAMI | ITEM | QUEST | ROOM"}
  is.config: {what: "a global config value (see config.py)"}
  room.gate.from: {what: "anchor key grouping the gates that apply when leaving a given room"}
  room.gate.to: {what: "anchor key grouping the gates guarding entry to a room"}
  SOULBOUND: {what: "a temporary lock on a kami: Value holds the expiry time. Set for 3 days when a kami is bought from the newbie vendor."}
  operator.cache: {what: "lookup from an operator wallet to its account, keyed by the wallet address; rewritten when the operator changes"}
  # anchor keys that group a registry entry's conditions, rewards and bonuses (the CONDITION / ALLOCATION / BONUS entries point at them with IDAnchor)
  auction.requirement: {what: "anchor key grouping the conditions for bidding in an auction"}
  goal.requirement: {what: "anchor key grouping the conditions for contributing to a goal"}
  listing.requirement: {what: "anchor key grouping the conditions for buying from a listing"}
  recipe.requirement: {what: "anchor key grouping the conditions for crafting a recipe"}
  registry.quest.requirement: {what: "anchor key grouping the conditions for accepting a quest"}
  registry.quest.objective: {what: "anchor key grouping a quest's objectives: conditions that must hold to complete it"}
  registry.quest.reward: {what: "anchor key grouping a quest's rewards (ALLOCATION entries)"}
  registry.skill.requirement: {what: "anchor key grouping the conditions for upgrading a skill"}
  registry.skill.bonus: {what: "anchor key grouping the bonuses a skill grants"}
  node.bonus: {what: "anchor key grouping the bonuses a node grants"}
  scavenge.reward: {what: "anchor key grouping a scavenge bar's rewards (ALLOCATION entries)"}
  item.usecase: {what: "anchor key grouping an item's use cases: one REFERENCE entry per way the item can be used (USE, ...), keyed by the item index"}
  item.requirement: {what: "anchor key grouping the conditions for one item use case; keyed by that use case's REFERENCE id, not the item"}
  item.allo: {what: "anchor key grouping what one item use case does (ALLOCATION entries); keyed by that use case's REFERENCE id, not the item"}
  # records holding item lists
  recipe.input: {what: "a recipe's inputs: Keys are item indices, Values the amounts consumed"}
  recipe.output: {what: "a recipe's outputs: Keys are item indices, Values the amounts produced"}
  trade.buy: {what: "what the trade's buy side asks for: Keys are item indices, Values the amounts"}
  trade.sell: {what: "what the trade's sell side offers: Keys are item indices, Values the amounts"}
  # classifiers and reverse lookups
  flag.type: {what: "anchor key for flags of one kind on one kind of parent (parentType, flagType); a has.flag's IDType points at it so all flags of that kind can be queried"}
  score.type: {what: "anchor key classifying a score by (epoch, index, scoreType); an is.score's IDType points at it, which is what leaderboards query"}
  score.total: {what: "running total of every score of one type (keyed by that score.type id), kept so an individual's share of the total can be computed"}
  snapshot.anchor: {what: "anchor key grouping the objective snapshots of one quest instance (the progress baselines taken when it was accepted)"}
  registry.trait.type: {what: "reverse lookup from a trait type (body, hand, face, color, background) to its trait entries, for querying all of one type"}
  goal.objective: {what: "a goal's objective, stored as a CONDITION at a hashed id"}
  node.requirement: {what: "anchor key grouping the CONDITIONs required to harvest a node"}
  listing.buy: {what: "buy-side pricing: rate, decay, period, scale"}
  listing.sell: {what: "sell-side pricing: rate, decay, period, scale"}
  goal.tier: {what: "a goal's reward tiers"}
  goal.reward: {what: "the rewards of one tier"}

open_questions: []

answered:   # questions settled with Acheron, with the date, so the reasoning survives
  - "2026-10-16 CONDITION, ROOM_GATE, COMMIT untyped: left as is for now. They are sub-structures or temporary records that don't want a label; the cost is that translating ECS events into the domain model is harder without one."
  - "2026-10-16 has.flag holders: ACCOUNT, KAMI, ITEM, QUEST, ROOM, plus a raw wallet address for WORLD_WHITELIST (read from the LibFlag call sites)."
  - "2026-10-16 KILL_BOUNTY_LOG (LibKill._logBounty): deprecated, to be deleted."
  - "2026-10-16 KamiOnyxRespec, KamiOnyxRename: keep as systems that update kamis, shown as disabled (every entry point reverts)."
  - "2026-10-16 Account skills: the code allows them (SkillUpgradeSystem), none exist in the registry for the time being."
  - "2026-10-16 Bonus allocations: only item use cases create them; nodes, goals and quests don't grant bonuses as rewards. By design."
  - "2026-10-16 TAX recipients: kamibots only today; guilds possibly later."
  - "2026-10-17 EQUIPMENT holder: kamis only for now (Acheron). The code comment's account branch is unused."
  - "2026-10-17 sacrifice.log and droptable.item.log holder: ACCOUNT, from the code. Both take holderID from the COMMIT's IdHolder, and LibSacrifice.commit / LibDroptable.commit store accID there via LibCommit.commit."
  - "2026-10-17 AccountUseItem grants vs item data: nothing reverts today (Acheron). Checked against the Notion Item Registry and Item Effects tables: every XP, COOLDOWN, STATE and CLEAR_BONUS effect is on an item marked For: Kami or Enemy_Kami, so they run through KamiUseItem. Account items carry only VIP, STAT, ITEM_DROPTABLE and one shelved ROOM effect, all granted. The gap in the atlas is real in the code but unreachable with current item data; it bites only if an account item gets an XP, cooldown, flag or state effect."

inconsistencies:   # places where the contracts model the same kind of thing two ways; nothing needs to change, but the atlas and the indexer have to know
  - "Typing: CONDITION, ROOM_GATE and COMMIT carry no EntityType while every other shape does; SCAVENGE's registry entry is typed but its per-account record (scavenge.instance) is not, whereas QUEST, SKILL and RELATIONSHIP type both halves."
  - "Id namespaces: registry ids are registry.<x>(index) for item, quest, skill, recipe, scavenge and trait, bare <x>(index) for node, room, goal, faction, auction, listing and NPC (upper case), bonus.registry for bonuses, kami.id for kamis. Instance ids are <x>.instance for most but bare friendship(), harvest(), relationship(); reward.instance and reference.instance are registry-layer entities despite the suffix."
  - "Counter ids: COMMIT, CONDITION, ROOM_GATE, TRADE, TOKEN_RECEIPT and the kami-market trio use world.getUniqueEntityId(); everything else is a keccak of a namespace and keys."
  - "Pointer naming: IDOwns*, IDAnchor, IDType, IDFrom, IDTo against IdHolder, IdSource, IdTarget (ID vs Id); LibAllo imports IdSource's id as IDSourceCompID, LibBonus as IdSourceCompID."
  - "Holder pointers: owned things mostly use IDOwns<Thing>; inventory of pools and trades, pool shares, commits and sub-records use IdHolder."
  - "Anchor keys: requirements hang off the registry index (node, goal, quest, skill, recipe; listing and auction off their ids) but items hang requirements and allocations off the use case's REFERENCE id; goal rewards hang off the tier id, not the goal."
  - "Bonus anchoring: nodes and skills anchor bonuses on their own anchor key; items anchor them on an ALLOCATION entry, so an item bonus is two hops from the item."
  - "Skill holders: whether a skill sits on a kami or an account is registry data (For), checked by shape string at runtime; IDOwnsSkill is the only ownership pointer whose target type is not fixed by code."
  - "Flags on non-entities: has.flag is keyed by entity id everywhere except WORLD_WHITELIST, which is keyed by a wallet address."
  - "GACHA_POOL: a constant id that owns unminted kamis but has nothing stored at it, unlike the other singletons."
  - "Disabled systems: KamiOnyxRespec and KamiOnyxRename are switched off by an unconditional revert at the top of execute rather than removed from deploy.json."
  - "Deploy grants: seven systems can reach component writes they are not granted (see each system's 'Writes without a deploy grant' in the atlas); KamiMarketBuy and Kami721Stake reach them on their main path."
